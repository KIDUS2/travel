server:
  port: ${PORT:8080}

spring:
  application:
    name: teguwaz-api
  r2dbc:
    url: ${DB_R2DBC_URL:r2dbc:postgresql://localhost:5432/teguwaz}
    username: ${DB_USER:teguwaz}
    password: ${DB_PASSWORD:teguwaz}
  flyway:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/teguwaz}
    user: ${DB_USER:teguwaz}
    password: ${DB_PASSWORD:teguwaz}
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/teguwaz}
  webflux:
    multipart:
      max-in-memory-size: 1MB
      max-disk-usage-per-part: ${UPLOAD_MAX_SIZE:200MB}

teguwaz:
  # Comma-separated emails that become admins when they first sign in (bootstrap)
  admin-emails: ${ADMIN_EMAILS:}
  # Optional: lets "Delete my account" also remove the Keycloak sign-in. Needs the confidential
  # client teguwaz-backend (service account with realm-management manage-users), see the realm file.
  keycloak-admin:
    base-url: ${KEYCLOAK_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:teguwaz}
    client-id: ${KEYCLOAK_BACKEND_CLIENT_ID:teguwaz-backend}
    client-secret: ${KEYCLOAK_BACKEND_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    # local = folder on this server (default) · s3 = MinIO / SeaweedFS / S3
    type: ${STORAGE_TYPE:local}
    local:
      dir: ${UPLOAD_DIR:./data/uploads}
      signing-key: ${FILE_LINK_SIGNING_KEY:}
      public-base-url: ${FILE_PUBLIC_BASE_URL:}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:teguwaz}
    secret-key: ${MINIO_SECRET_KEY:teguwaz-secret}
    bucket: ${MINIO_BUCKET:teguwaz-media}
    region: ${MINIO_REGION:us-east-1}
    presign-expiry-minutes: 60

  platforms:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    # Base64 32 bytes, encrypts stored OAuth tokens: openssl rand -base64 32
    encryption-key: ${TOKEN_ENCRYPTION_KEY:}
    state-key: ${OAUTH_STATE_KEY:}
    youtube:
      client-id: ${YOUTUBE_CLIENT_ID:}
      client-secret: ${YOUTUBE_CLIENT_SECRET:}
      redirect-uri: ${YOUTUBE_REDIRECT_URI:http://localhost:8080/api/channels/oauth/youtube/callback}
      # Free key from Google Cloud (YouTube Data API v3): real public stats for any channel link
      api-key: ${YOUTUBE_API_KEY:}
    # TikTok for Developers app with Login Kit + Display API (scopes user.info.basic, user.info.profile, user.info.stats, video.list)
    tiktok:
      client-id: ${TIKTOK_CLIENT_KEY:}
      client-secret: ${TIKTOK_CLIENT_SECRET:}
      redirect-uri: ${TIKTOK_REDIRECT_URI:http://localhost:8080/api/channels/oauth/tiktok/callback}
    # Meta app with "Instagram API with Instagram login" (Business or Creator accounts)
    instagram:
      client-id: ${INSTAGRAM_APP_ID:}
      client-secret: ${INSTAGRAM_APP_SECRET:}
      redirect-uri: ${INSTAGRAM_REDIRECT_URI:http://localhost:8080/api/channels/oauth/instagram/callback}

  # Printed books. Prices in Ethiopian birr: set these to your printing partner's real prices.
  printing:
    min-pages: 20
    max-pages: 120
    pickup-address: ${PRINT_PICKUP_ADDRESS:Pickup point in Addis Ababa (set PRINT_PICKUP_ADDRESS)}
    base-price:
      "[a4-landscape]": 1800
      "[a4-portrait]": 1800
      "[a5-portrait]": 950
      "[square]": 1500
    extra-page-price:
      "[a4-landscape]": 40
      "[a4-portrait]": 40
      "[a5-portrait]": 25
      "[square]": 35
    finish-price:
      "[hard]": 600
      "[soft]": 0
      "[lay]": 900
    delivery-fee:
      "[PICKUP]": 0
      "[ADDIS]": 250
      "[REGIONAL]": 600

  payments:
    chapa:
      # Secret key from dashboard.chapa.co (CHASECK_TEST-... for test mode). Empty = ordering shows "not set up".
      secret-key: ${CHAPA_SECRET_KEY:}
      base-url: ${CHAPA_BASE_URL:https://api.chapa.co}
      # Public URL of this backend; Chapa calls <url>/api/orders/chapa/callback after payment
      backend-public-url: ${BACKEND_PUBLIC_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

