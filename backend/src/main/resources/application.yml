server:
  port: ${PORT:8080}

spring:
  application:
    name: teguwaz-api
  r2dbc:
    url: ${DB_R2DBC_URL:r2dbc:postgresql://localhost:5432/teguwaz}
    username: ${DB_USER:teguwaz}
    password: ${DB_PASSWORD:teguwaz}
  flyway:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/teguwaz}
    user: ${DB_USER:teguwaz}
    password: ${DB_PASSWORD:teguwaz}
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/teguwaz}
  webflux:
    multipart:
      max-in-memory-size: 1MB
      max-disk-usage-per-part: ${UPLOAD_MAX_SIZE:200MB}

teguwaz:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:teguwaz}
    secret-key: ${MINIO_SECRET_KEY:teguwaz-secret}
    bucket: ${MINIO_BUCKET:teguwaz-media}
    region: ${MINIO_REGION:us-east-1}
    presign-expiry-minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info
