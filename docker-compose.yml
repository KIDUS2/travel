# Local infrastructure for Teguwaz: PostgreSQL, Keycloak and MinIO.
# Ports clash with another project? Run e.g. KEYCLOAK_PORT=8181 POSTGRES_PORT=5433 docker compose up -d
# Run the backend (mvn spring-boot:run) and frontend (npm run dev) on your machine.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: teguwaz
      POSTGRES_USER: teguwaz
      POSTGRES_PASSWORD: teguwaz
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teguwaz -d teguwaz"]
      interval: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=${KEYCLOAK_PORT:-8180}"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      # "Continue with Google": Google OAuth client (Web application) with redirect URI
      # http://localhost:${KEYCLOAK_PORT:-8180}/realms/teguwaz/broker/google/endpoint
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-not-configured}
      TEGUWAZ_WEB_URL: ${TEGUWAZ_WEB_URL:-http://localhost:5173}
      # Secret of the teguwaz-backend client; give the backend the same value as KEYCLOAK_BACKEND_SECRET
      KEYCLOAK_BACKEND_SECRET: ${KEYCLOAK_BACKEND_SECRET:-teguwaz-backend-dev-secret}
    ports:
      - "${KEYCLOAK_PORT:-8180}:${KEYCLOAK_PORT:-8180}"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: teguwaz
      MINIO_ROOT_PASSWORD: teguwaz-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
